[package]
name = "livekit_client"
version = "0.1.0"
edition.workspace = true
description = "Logic for using LiveKit with GPUI"
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[[example]]
name = "test_app"

[features]
test-support = ["collections/test-support", "gpui/test-support", "livekit_api/test-support", "dep:nanoid", "dep:postage"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
audio.workspace = true
collections.workspace = true
futures.workspace = true
gpui = { workspace = true }
gpui_tokio.workspace = true
http_client_tls.workspace = true
image.workspace = true
livekit_api = { workspace = true, optional = true }
log.workspace = true
nanoid = { workspace = true, optional = true }
parking_lot.workspace = true
postage = { workspace = true, optional = true, features = ["futures-traits", "logging", "blocking"] }
serde.workspace = true
serde_urlencoded.workspace = true
settings.workspace = true
smallvec.workspace = true
ui.workspace = true
util.workspace = true

[target.'cfg(target_env = "ohos")'.dependencies]
rodio = { git = "https://github.com/RustAudio/rodio", rev = "3ee9745862279ce1d18db593155016e7ce024aeb", default-features = false }

[target.'cfg(any(target_env = "ohos", all(target_os = "windows", target_env = "gnu"), target_os = "freebsd"))'.dependencies]
livekit_api.workspace = true
nanoid.workspace = true
postage = { workspace = true, features = ["futures-traits", "logging", "blocking"] }

[target.'cfg(not(any(target_env = "ohos", all(target_os = "windows", target_env = "gnu"), target_os = "freebsd")))'.dependencies]
libwebrtc.workspace = true
livekit.workspace = true

[target.'cfg(not(target_env = "ohos"))'.dependencies]
cpal.workspace = true
gpui = { workspace = true, features = ["screen-capture", "x11", "wayland"] }
rodio.workspace = true

[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies]
tokio = { workspace = true, features = ["time"] }
webrtc-sys.workspace = true

[target.'cfg(any(all(target_os = "linux", not(target_env = "ohos")), target_os = "freebsd", target_os = "windows"))'.dependencies]
scap.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { workspace = true, features = ["CFDictionary", "CFNumber"] }
objc2-core-video = { workspace = true, features = ["CVBase", "CVPixelBuffer", "CVPixelBufferIOSurface", "CVPixelBufferPool", "CVReturn"] }
coreaudio-rs = { workspace = true, features = ["core_audio"] }

[dev-dependencies]
collections = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
gpui_platform.workspace = true
livekit_api = { workspace = true, features = ["test-support"] }
nanoid.workspace = true
postage = { workspace = true, features = ["futures-traits", "logging"] }
simplelog.workspace = true

[build-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[package.metadata.cargo-shear]
ignored = ["serde_json"]

[package]
name = "audio"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/audio.rs"
doctest = false

[dependencies]
anyhow.workspace = true
collections.workspace = true
crossbeam-queue.workspace = true
futures.workspace = true
gpui.workspace = true
log.workspace = true
parking_lot.workspace = true
settings.workspace = true
thiserror.workspace = true
util.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(target_env = "ohos")'.dependencies]
libloading = "0.8"
ohos-audio-sys = { git = "https://github.com/ohos-rs/ohos-native-bindings.git", rev = "b732254b974f5a0a85c58cd1c20744b3f32e81fd", features = ["api-26"] }
rodio = { git = "https://github.com/RustAudio/rodio", rev = "3ee9745862279ce1d18db593155016e7ce024aeb", default-features = false, features = ["wav"] }

[target.'cfg(not(target_env = "ohos"))'.dependencies]
cpal.workspace = true
rodio.workspace = true

[target.'cfg(not(any(target_env = "ohos", all(target_os = "windows", target_env = "gnu"), target_os = "freebsd")))'.dependencies]
libwebrtc.workspace = true
